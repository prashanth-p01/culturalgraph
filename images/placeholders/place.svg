<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A154B" />
      <stop offset="50%" stop-color="#7B1FA2" />
      <stop offset="100%" stop-color="#1F0824" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FFA000" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgGrad)" />
  <!-- Gopuram silhouette lines -->
  <path d="M 320 380 L 360 160 L 400 110 L 440 160 L 480 380 Z" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.4" />
  <text x="400" y="240" font-family="'Noto Serif Tamil', Georgia, serif" font-size="64" fill="#FFD54F" text-anchor="middle" font-weight="bold">புனிதத் தலங்கள்</text>
  <text x="400" y="300" font-family="'Noto Serif', Georgia, serif" font-size="28" fill="#FFFFFF" text-anchor="middle" letter-spacing="4" opacity="0.9">TEMPLES &amp; SACRED SITES</text>
  <path d="M 300 330 L 500 330" stroke="url(#goldGrad)" stroke-width="2" opacity="0.5" />
  <text x="400" y="440" font-family="sans-serif" font-size="16" fill="#E5DFD5" text-anchor="middle" opacity="0.7">CultureGraph — Tamil Nadu Cultural Heritage</text>
</svg>
