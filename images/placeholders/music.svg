  </defs>
  <rect width="800" height="500" fill="url(#bgGrad)" />
  <circle cx="400" cy="220" r="140" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.3" stroke-dasharray="8,8" />
  <text x="400" y="240" font-family="'Noto Serif Tamil', Georgia, serif" font-size="72" fill="#FFE082" text-anchor="middle" font-weight="bold">இசை</text>
