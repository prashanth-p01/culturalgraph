  </defs>
  <rect width="800" height="500" fill="url(#bgGrad)" />
  <circle cx="400" cy="220" r="140" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.35" />
  <text x="400" y="240" font-family="'Noto Serif Tamil', Georgia, serif" font-size="68" fill="#E0F2F1" text-anchor="middle" font-weight="bold">தமிழ்நாடு மாவட்டம்</text>
  <text x="400" y="300" font-family="'Noto Serif', Georgia, serif" font-size="28" fill="#FFFFFF" text-anchor="middle" letter-spacing="4" opacity="0.9">DISTRICTS OF TAMIL NADU</text>
  <path d="M 300 330 L 500 330" stroke="url(#goldGrad)" stroke-width="2" opacity="0.5" />
  <text x="400" y="440" font-family="sans-serif" font-size="16" fill="#B2DFDB" text-anchor="middle" opacity="0.7">CultureGraph — Tamil Nadu Cultural Heritage</text>
