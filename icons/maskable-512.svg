<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9E2233" />
      <stop offset="100%" stop-color="#5E0F1B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC837" />
      <stop offset="100%" stop-color="#D98200" />
    </linearGradient>
  </defs>
  <!-- Full bleed for maskable safe zone -->
  <rect width="512" height="512" fill="url(#maroonGrad)" />
  
  <!-- Subtle Gopuram Arch Motif within 80% safe zone -->
  <path d="M 120 380 L 120 270 Q 256 120 392 270 L 392 380 Z" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.3" />
  
  <!-- Tamil Letter 'க' centered in safe zone -->
  <text x="256" y="325" font-family="'Noto Sans Tamil', 'Latha', 'Arial', sans-serif" font-size="180" font-weight="bold" fill="#FFF8EE" text-anchor="middle">க</text>
</svg>
